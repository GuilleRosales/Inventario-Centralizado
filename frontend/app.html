<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Centralizado</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-body">
    <div class="app-shell" id="app-shell">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <div class="brand-logo small" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z" stroke-linejoin="round"/>
                        <path d="M3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <strong>Inventario</strong>
                    <span>Centralizado</span>
                </div>
                <button class="icon-btn sidebar-close" id="sidebar-close" aria-label="Cerrar menú">×</button>
            </div>

            <nav class="nav" id="nav" aria-label="Navegación principal"></nav>

            <div class="sidebar-foot">
                <div class="user-mini">
                    <div class="avatar" id="user-avatar">?</div>
                    <div class="user-mini-text">
                        <strong id="user-name">Usuario</strong>
                        <span id="user-role">Rol</span>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm btn-block" id="logout-btn" type="button">
                    Cerrar sesión
                </button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menú">☰</button>
                <div class="topbar-title">
                    <h1 id="page-title">Panel de control</h1>
                    <p id="page-subtitle">Resumen general del inventario</p>
                </div>
                <div class="topbar-actions">
                    <label class="branch-picker">
                        <span>Sucursal</span>
                        <select id="branch-select"></select>
                    </label>
                    <div class="topbar-user">
                        <div class="avatar" id="top-avatar">?</div>
                        <div class="topbar-user-text">
                            <strong id="top-name">Usuario</strong>
                            <span id="top-role">Rol</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content" id="content" aria-live="polite"></main>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script type="module" src="/js/core/app.js"></script>
</body>
</html>
